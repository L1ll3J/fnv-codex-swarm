[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fnv-native-swarm"
version = "0.5.3"
description = "Owner-operated native swarm terminal application"
requires-python = ">=3.11"
dependencies = ["textual==8.2.8"]

[project.scripts]
native-swarm = "native_swarm.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
native_swarm = ["prompts/*.xml"]
